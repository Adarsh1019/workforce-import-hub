services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: workforce
      POSTGRES_USER: workforce
      POSTGRES_PASSWORD: workforce
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U workforce"]
      interval: 5s
      retries: 10

  backend:
    build: ./backend
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DB_URL: jdbc:postgresql://postgres:5432/workforce
      DB_USER: workforce
      DB_PASSWORD: workforce
      JWT_SECRET: please-change-this-to-a-long-random-string-0123456789
      CORS_ORIGINS: "*"
      UPLOAD_DIR: /data/uploads
    ports:
      - "8081:8081"
    volumes:
      - uploads:/data/uploads

volumes:
  pgdata:
  uploads:
